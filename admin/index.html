<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>HoloGen Content Admin</title>
  <link rel="shortcut icon" href="../assets/images/hologen-favicon-128x130.png" type="image/x-icon">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f8f7;
      color: #1f2d2f;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(640px, calc(100% - 40px));
      padding: 32px;
      background: #ffffff;
      border: 1px solid rgba(31, 45, 47, 0.12);
      border-radius: 8px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 1.75rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      padding: 12px 18px;
      background: #3a7b98;
      color: #ffffff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>HoloGen Content Admin</h1>
    <p>Use the configured CMS to edit blog posts and upload media. Access is controlled through GitHub and Pages CMS.</p>
    <a href="https://app.pagescms.org/" rel="noopener">Open Pages CMS</a>
  </main>
</body>
</html>
